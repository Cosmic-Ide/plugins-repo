name: Build plugins

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: Cosmic-Ide/Cosmic-IDE
          path: Cosmic-IDE
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK
        run: sdkmanager "platforms;android-37.1" "build-tools;37.0.0"
      - uses: gradle/actions/setup-gradle@v4
      - name: Build plugin bundles
        run: ./gradlew packageProdReleasePlugin -PcosmicIdeDir="$GITHUB_WORKSPACE/Cosmic-IDE"
      - name: Verify committed checksums are current
        run: git diff --exit-code -- plugins.json
      - name: Verify plugin bundles
        run: |
          while IFS=$'\t' read -r id download_url expected; do
            bundle="artifacts/${download_url##*/}"
            if [[ ! -f "$bundle" ]]; then
              echo "::error title=Missing plugin bundle::$id expects $bundle"
              exit 1
            fi

            actual="$(sha256sum "$bundle" | cut -d ' ' -f 1)"
            if [[ "$actual" != "$expected" ]]; then
              echo "::error title=Plugin checksum mismatch::$id expected $expected but got $actual"
              exit 1
            fi
          done < <(jq -r '.[] | [.id, .downloadUrl, .sha256] | @tsv' plugins.json)
      - uses: actions/upload-artifact@v4
        with:
          name: plugin-bundles
          path: artifacts/*.zip
          if-no-files-found: error
